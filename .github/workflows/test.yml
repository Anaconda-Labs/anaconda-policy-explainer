name: test

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.81.0
          cache: true
      - run: pixi run lint
      - run: pixi run typecheck
      - run: pixi run test

  # Wildcard job for branch protection: require only this check.
  check:
    name: Check all tests passed
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
